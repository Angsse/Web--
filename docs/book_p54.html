            <h2 align="center"中国传统文化故事:悬梁刺股</h2>
        <hr>
        <p>我们伟大的祖国有非常悠久的历史。按照古代的传统说法，从传说中的黄帝到现在有四千多年的历史，通常叫作“上下五千年”。期间流传有许多的神话、历史故事等。快来一起了解下我国的文化历史吧。</p >
        <p>悬梁刺股这一历史典故表现了孙敬、苏秦好学勤读的刻苦精神，表明只要付出时间和精力就会有收获的道理，用以激励人发愤读书。如果想要把事情做成功，就要下定决心，明确目标。要肯吃苦，肯努力。世上无难事，只怕有心人</p>
        <hr>
        <ul type="circle">
            <li>1.悬梁刺股</li>
