<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格</title>
    <style>
        tr{
            height: 50px;
        }
        td{
            text-align: center;
        }
        .bgc{
            background-color: #555454;
        }
    </style>
</head>
<body>
    <!--table   caption  th  tr  td-->
    <table border="1" align="center" width="650px" cellspacing="0" cellpadding="10">
        <caption>比赛安排</caption>
        <tr height="60px">
            <th>日期</th>
            <th>时间</th>
            <th width="300px">比赛项目</th>
            <th>备注</th>
        </tr>

        <tr>
            <td>2024-06-01</td>
            <td>10:00</td>
            <td>100米跑</td>
            <td>1号体育场</td>
        </tr>

        <tr>
            <td>2024-06-01</td>
            <td>10:00</td>
            <td>100米跑</td>
            <td>2号体育场</td>
        </tr>

        <tr>
            <td>2024-06-01</td>
            <td>10:00</td>
            <td>100米游泳</td>
            <td>1号游泳馆</td>
        </tr>
    </table>
</body>
</html>
