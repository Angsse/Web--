<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册表</title>
</head>
<style>
    textarea {
        resize: none;
    }
</style>
<body>
    <from action="" method="post">
        <table border="1" align="center" width="500">
            <caption>青春不常在 抓紧谈恋爱</caption>
            <tr>
                <td><label for="name" placeholder="请输入真实姓名">姓名</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label for="">性别</label></td>
                <td><input type="radio" name="gender">男 <input type="radio" name="gender">女</td>
            </tr>

            <tr>
                <td><label for="">生日</label></td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td><label for="">省份</label></td>
                <td>
                    <select name="" id="">
                        <option>北京</option>
                        <option>上海</option>
                        <option>四川</option>
                        <option>广东</option>
                        <option>浙江</option>
                        <option>江苏</option>
                        <option>山东</option>
                        <option>福建</option>
                        <option>湖南</option>
                        <option>湖北</option>
                        <option>江西</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="">学历</label></td>
                <td>
                    <select name="" id="">
                        <option>小学</option>
                        <option>初中</option>
                        <option>高中/职高</option>
                        <option>大专/高职</option>
                        <option>本科</option>
                        <option>硕士</option>
                        <option>博士</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="">手机号</label></td>
                <td><input type="tel" pattern="1[0-9]{2}[0-9]{4}[0-9]"></td>
            </tr>

            <tr>
                <td><label for="">邮箱</label></td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td><label for="">创建密码</label></td>
                <td><input type="password" placeholder="密码由6-10位数字和字母组成"></td>
            </tr>

            <tr>
                <td><label for="">兴趣爱好</label></td>
                <td><input type="checkbox">阅读 <input type="checkbox">运动 <input type="checkbox">音乐</td>
            </tr>

            <tr>
                <td><label for="">幸运数字</label></td>
                <td><input type="number" max="10" min="0">0<input type="range" max="100" min="0">100</td>
            </tr>

            <tr>
                <td><label for="">喜欢的颜色</label></td>
                <td><input type="color"></td>
            </tr>

            <tr>
                <td><label for="">自我介绍</label></td>
                <td><textarea name="" id=""rows="5" cols="40" placeholder="请简要介绍自己..."></textarea></td>
            </tr>
            <tr>
                <td><label for="">个人照片</label></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td><label for=""> </label></td>
                <td><input type="button" value="注册" style="background-color: pink;"></td>
                <input type ="submit">
                <input type="reset" value="清空">
                <button>注册</button>

            </tr>

        </table>
    </from>
</body>
</html>
